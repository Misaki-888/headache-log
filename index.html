<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>頭痛ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f2f5;--surface:rgba(255,255,255,0.85);--surface-solid:#fff;
  --surface-alt:rgba(247,248,250,0.92);--border:rgba(226,229,234,0.8);
  --text-primary:#1a1d23;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --accent:#4f6ef7;--accent-light:rgba(238,240,254,0.9);--accent-hover:#3b57e0;
  --danger:#ef4444;--danger-light:rgba(254,242,242,0.9);
  --warn:#f59e0b;--warn-light:rgba(255,251,235,0.9);
  --success:#10b981;--success-light:rgba(236,253,245,0.9);
  --mono:'DM Mono',monospace;--sans:'Noto Sans JP',sans-serif;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --blur:blur(16px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c14;--surface:rgba(28,31,42,0.88);--surface-solid:#1c1f2a;
  --surface-alt:rgba(36,40,54,0.92);--border:rgba(46,51,69,0.8);
  --text-primary:#e8eaf0;--text-secondary:#9098b0;--text-muted:#5c6480;
  --accent-light:rgba(30,37,80,0.9);--danger-light:rgba(42,26,26,0.9);
  --warn-light:rgba(42,34,16,0.9);--success-light:rgba(15,42,30,0.9);
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{min-height:100%;color:var(--text-primary);font-family:var(--sans);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  position:relative;overflow-x:hidden;}
#season-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--season-overlay,transparent);}
.app-shell{position:relative;z-index:2;}

/* ── Login Screen ── */
#login-screen{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
  background:var(--bg);
}
.login-card{
  width:100%;max-width:360px;
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:32px 24px;box-shadow:var(--shadow);
  text-align:center;
}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text-muted);margin-bottom:28px;}
.login-badge{font-size:48px;margin-bottom:16px;}
.account-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.account-btn{
  padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);color:var(--text-primary);
  font-family:var(--sans);font-size:15px;font-weight:500;
  cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;
  transition:all .15s;
}
.account-btn:hover{border-color:var(--accent);color:var(--accent);}
.account-avatar{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
.new-account{margin-top:8px;}
.new-account-row{display:flex;gap:8px;}
.new-account-row input{
  flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);color:var(--text-primary);
  font-family:var(--sans);font-size:15px;outline:none;
}
.new-account-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.12);}
.btn-add{
  padding:11px 16px;border:none;border-radius:var(--radius-sm);
  background:var(--accent);color:#fff;font-family:var(--sans);font-size:14px;font-weight:600;
  cursor:pointer;white-space:nowrap;
}

/* ── Header ── */
.app-header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:101;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);}
.header-left{display:flex;align-items:center;gap:8px;}
.header-avatar{
  width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  cursor:pointer;flex-shrink:0;
}
.app-header h1{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.header-right{display:flex;align-items:center;gap:8px;}
.season-badge{font-size:18px;line-height:1;}
.header-meta{font-family:var(--mono);font-size:12px;color:var(--text-muted);}

/* ── Tab bar ── */
.tab-bar{
  display:flex;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);padding:0 8px;
}
.tab-btn{
  flex:1;padding:11px 4px;border:none;background:none;
  font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text-secondary);
  cursor:pointer;position:relative;transition:color .15s;white-space:nowrap;
}
.tab-btn.active{color:var(--accent);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:6px;right:6px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;}

.main{max-width:480px;margin:0 auto;padding:16px 14px 64px;}

/* ── Cards ── */
.card{
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;}

/* ── Weather ── */
.weather-banner{
  background:var(--accent-light);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.weather-icon{font-size:28px;line-height:1;flex-shrink:0;}
.weather-body{flex:1;min-width:0;}
.weather-grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;align-items:baseline;}
.weather-item{font-size:11px;color:var(--text-muted);white-space:nowrap;}
.weather-val{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text-primary);}
.weather-status{font-size:10px;color:var(--text-muted);margin-top:5px;}

/* ── Form ── */
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field-label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:8px;}
.required{color:var(--danger);margin-left:2px;font-size:10px;}
input[type="time"],input[type="number"],input[type="text"],textarea{
  width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);color:var(--text-primary);
  font-family:var(--sans);font-size:15px;outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;
}
input[type="number"]{font-family:var(--mono);}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.12);}
textarea{resize:vertical;min-height:80px;}
.toggle-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.toggle-btn{
  padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);color:var(--text-secondary);
  font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
  transition:all .15s;text-align:center;-webkit-tap-highlight-color:transparent;
}
.toggle-btn.selected-yes{background:var(--danger-light);border-color:var(--danger);color:var(--danger);}
.toggle-btn.selected-no{background:var(--success-light);border-color:var(--success);color:var(--success);}
.scale-wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.scale-btn{
  aspect-ratio:1;border:1px solid var(--border);border-radius:8px;
  background:var(--surface-alt);color:var(--text-secondary);
  font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;
  transition:all .12s;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;padding:0;
}
.scale-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.scale-hint{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:5px;}
.chip-group{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  padding:7px 13px;border:1px solid var(--border);border-radius:999px;
  background:var(--surface-alt);color:var(--text-secondary);
  font-size:13px;cursor:pointer;transition:all .12s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.chip.selected{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:500;}
.drug-chip-group{display:flex;flex-direction:column;gap:8px;}
.drug-chip{
  display:flex;align-items:center;gap:12px;padding:13px 16px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);cursor:pointer;transition:all .12s;
  -webkit-tap-highlight-color:transparent;
}
.drug-chip.selected{background:var(--accent-light);border-color:var(--accent);}
.drug-check{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .12s;font-size:12px;
}
.drug-chip.selected .drug-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.drug-label{font-size:14px;font-weight:500;}
.drug-sub{font-size:12px;color:var(--text-muted);margin-left:auto;}
.conditional{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .2s;pointer-events:none;}
.conditional.open{max-height:400px;opacity:1;pointer-events:auto;}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.section-head{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-head::after{content:'';flex:1;height:1px;background:var(--border);}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.btn-submit{
  width:100%;padding:15px;border:none;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;
  cursor:pointer;transition:background .15s,transform .1s;margin-top:6px;
  -webkit-tap-highlight-color:transparent;
}
.btn-submit:active{transform:scale(.97);background:var(--accent-hover);}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;}

/* ── Calendar ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-size:16px;font-weight:700;}
.cal-nav{
  width:36px;height:36px;border:1px solid var(--border);border-radius:50%;
  background:var(--surface-alt);color:var(--text-primary);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-muted);padding:4px 0;font-weight:500;}
.cal-day{
  aspect-ratio:1;border-radius:10px;border:1px solid transparent;
  background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  -webkit-tap-highlight-color:transparent;transition:all .12s;
  position:relative;
}
.cal-day:hover{background:var(--accent-light);border-color:var(--border);}
.cal-day.today{border-color:var(--accent);background:var(--accent-light);}
.cal-day.has-data{background:var(--surface-alt);}
.cal-day-num{font-size:13px;font-weight:500;color:var(--text-primary);line-height:1;}
.cal-day.other-month .cal-day-num{color:var(--text-muted);}
.cal-dots{display:flex;gap:2px;justify-content:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-dot.headache{background:var(--danger);}
.cal-dot.night{background:var(--accent);}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
  background:var(--surface-solid);border-radius:var(--radius) var(--radius) 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.32,0,.67,0);
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;}

/* ── Day select modal ── */
.day-select-btns{display:flex;flex-direction:column;gap:10px;}
.day-select-btn{
  padding:16px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-alt);color:var(--text-primary);
  font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:all .15s;
}
.day-select-btn:hover{border-color:var(--accent);background:var(--accent-light);}
.day-select-btn .icon{font-size:22px;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--text-primary);color:var(--bg);
  padding:11px 22px;border-radius:999px;
  font-size:14px;font-weight:500;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  z-index:999;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<canvas id="season-canvas"></canvas>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-badge" id="login-badge">🤕</div>
    <div class="login-title">頭痛ログ</div>
    <div class="login-sub">アカウントを選んでください</div>
    <div class="account-list" id="account-list"></div>
    <div class="new-account">
      <div class="new-account-row">
        <input type="text" id="new-nickname" placeholder="ニックネームを入力" maxlength="20">
        <button class="btn-add" onclick="addAccount()">追加</button>
      </div>
    </div>
  </div>
</div>

<div class="app-shell" id="app-shell" style="display:none">
<header class="app-header">
  <div class="header-left">
    <div class="header-avatar" id="header-avatar" onclick="logout()" title="ログアウト"></div>
    <h1 id="header-title">頭痛ログ</h1>
  </div>
  <div class="header-right">
    <span class="season-badge" id="season-badge"></span>
    <span class="header-meta" id="clock">--:--</span>
  </div>
</header>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('headache')" id="tab-headache">🤕 頭痛発症時</button>
  <button class="tab-btn" onclick="switchTab('night')" id="tab-night">🌙 夜の記録</button>
  <button class="tab-btn" onclick="switchTab('calendar')" id="tab-calendar">📅 カレンダー</button>
</div>

<!-- 頭痛発症時 -->
<div class="main" id="pane-headache">
  <div class="weather-banner">
    <div class="weather-icon" id="w-icon">⏳</div>
    <div class="weather-body">
      <div class="weather-grid" id="weather-grid"><div class="weather-item" style="grid-column:1/-1">取得中…</div></div>
      <div class="weather-status" id="w-status">位置情報を取得しています</div>
    </div>
  </div>
  <div class="card">
    <div class="card-label">発症の詳細</div>
    <div class="field">
      <label class="field-label">対象日付 <span class="required">*</span></label>
      <input type="date" id="h-date" onchange="onHeadacheDateChange()">
    </div>
    <div class="field">
      <label class="field-label">入力タイミング</label>
      <div class="toggle-group">
        <button class="toggle-btn selected-no" id="h-timing-now" onclick="setHeadacheTiming('now')">現在</button>
        <button class="toggle-btn" id="h-timing-later" onclick="setHeadacheTiming('later')">後入力</button>
      </div>
    </div>
    <div class="field">
      <label class="field-label">発症時刻 <span class="required">*</span></label>
      <input type="time" id="h-onset-time" onchange="onHeadacheTimeChange()">
    </div>
    <div class="field">
      <label class="field-label">痛みの強さ <span class="required">*</span></label>
      <div class="scale-wrap" id="scale-pain"></div>
      <input type="hidden" id="pain-val">
      <div class="scale-hint"><span>気にならない</span><span>救急レベル</span></div>
    </div>
    <div class="field">
      <label class="field-label">部位（複数可）</label>
      <div class="chip-group" id="chips-area"></div>
    </div>
    <div class="field">
      <label class="field-label">性質（複数可）</label>
      <div class="chip-group" id="chips-type"></div>
    </div>
    <hr class="divider">
    <div class="field">
      <label class="field-label">前兆</label>
      <div class="toggle-group">
        <button class="toggle-btn" onclick="toggleYN(this,'h-aura','yes')">あった</button>
        <button class="toggle-btn" onclick="toggleYN(this,'h-aura','no')">なかった</button>
      </div>
      <input type="hidden" id="h-aura">
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="field-label">随伴症状（複数可）</label>
      <div class="chip-group" id="chips-assoc"></div>
    </div>
  </div>
  <div class="card">
    <div class="section-head">薬の服用（複数可）</div>
    <div class="drug-chip-group" id="drug-group"></div>
    <div class="conditional" id="cond-drug-time">
      <div style="margin-top:14px">
        <label class="field-label">服用時刻</label>
        <input type="time" id="h-drug-time">
      </div>
    </div>
  </div>
  <button class="btn-submit" onclick="submitHeadache()">記録する</button>
</div>

<!-- 夜の記録 -->
<div class="main" id="pane-night" style="display:none">
  <div class="weather-banner">
    <div class="weather-icon" id="w-icon-n">⏳</div>
    <div class="weather-body">
      <div class="weather-grid" id="weather-grid-n"><div class="weather-item" style="grid-column:1/-1">取得中…</div></div>
      <div class="weather-status" id="w-status-n">位置情報を取得しています</div>
    </div>
  </div>
  <div class="card">
    <div class="card-label">対象日付</div>
    <div class="field" style="margin-bottom:0">
      <input type="date" id="n-date">
    </div>
  </div>
  <div class="card">
    <div class="card-label">睡眠</div>
    <div class="input-row">
      <div class="field" style="margin-bottom:0">
        <label class="field-label">起床時刻 <span class="required">*</span></label>
        <input type="time" id="n-wake">
      </div>
      <div class="field" style="margin-bottom:0">
        <label class="field-label">睡眠時間(h) <span class="required">*</span></label>
        <input type="number" id="n-sleep" min="0" max="24" step="0.5" placeholder="7.0">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-label">今日の状況</div>
    <div class="field">
      <label class="field-label">カフェイン(杯)</label>
      <input type="number" id="n-caffeine" min="0" max="20" step="1" placeholder="0">
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="field-label">今日、頭痛はあったか</label>
      <div class="toggle-group">
        <button class="toggle-btn" onclick="toggleYN(this,'n-had-headache','yes')">あった</button>
        <button class="toggle-btn" onclick="toggleYN(this,'n-had-headache','no')">なかった</button>
      </div>
      <input type="hidden" id="n-had-headache">
    </div>
  </div>

<script>

// GAS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const GAS_URL='https://script.google.com/macros/s/AKfycbx2XZnUcktKew-fbaGnRwJ9B-h6hyXGFlda7qig4fmWg8upaUH7GvLq3EC9elC01_PJ/exec';

async function sendToSheets(entry){
  return new Promise(resolve=>{
    try{
      let iframe=document.getElementById('_gas_iframe');
      if(!iframe){iframe=document.createElement('iframe');iframe.name='_gas_iframe';iframe.id='_gas_iframe';iframe.style.display='none';document.body.appendChild(iframe);}
      const form=document.createElement('form');
      form.method='POST';form.action=GAS_URL;form.target='_gas_iframe';form.style.display='none';
      const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(entry);
      form.appendChild(input);document.body.appendChild(form);form.submit();form.remove();
      setTimeout(()=>resolve(true),3000);
    }catch(e){resolve(false);}
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Account（Sheets連携版）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentUser=null;
let cachedLogs=[];

function loadAccounts(){return JSON.parse(localStorage.getItem('hlog_accounts')||'[]');}
function saveAccounts(a){localStorage.setItem('hlog_accounts',JSON.stringify(a));}

async function renderAccountList(){
  const list=document.getElementById('account-list');
  list.innerHTML='<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:8px">読み込み中…</div>';
  // Sheetsからユーザー一覧を取得
  try{
    const r=await fetch(`${GAS_URL}?action=users`);
    const j=await r.json();
    if(j.ok&&j.users){
      const sheetsUsers=j.users;
      // ローカルのユーザーもマージ
      const local=loadAccounts();
      const merged=[...new Set([...sheetsUsers,...local])];
      saveAccounts(merged);
    }
  }catch(e){console.log('ユーザー取得失敗、ローカルを使用');}

  const accounts=loadAccounts();
  list.innerHTML='';
  accounts.forEach(name=>{
    const btn=document.createElement('button');
    btn.className='account-btn';
    btn.innerHTML=`<div class="account-avatar">${name[0].toUpperCase()}</div><span>${name}</span>`;
    btn.onclick=()=>login(name);
    list.appendChild(btn);
  });
}

function addAccount(){
  const input=document.getElementById('new-nickname');
  const name=input.value.trim();
  if(!name){showToast('ニックネームを入力してください');return;}
  const accounts=loadAccounts();
  if(accounts.includes(name)){showToast('そのニックネームはすでに使われています');return;}
  accounts.push(name);
  saveAccounts(accounts);
  input.value='';
  login(name);
}

async function login(name){
  currentUser=name;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-shell').style.display='';
  document.getElementById('header-avatar').textContent=name[0].toUpperCase();
  document.getElementById('header-title').textContent=`${name}の頭痛ログ`;

  // Sheetsからデータを取得してキャッシュ
  showToast('📥 データを同期中…');
  try{
    const r=await fetch(`${GAS_URL}?action=login&user=${encodeURIComponent(name)}`);
    const j=await r.json();
    if(j.ok&&j.logs){
      cachedLogs=j.logs.map(l=>({...l,id:Number(l.id)||l.id}));
      // ローカルにも保存
      saveLogs(cachedLogs);
      showToast('✅ データを同期しました');
    }
  }catch(e){
    // オフライン時はローカルから
    cachedLogs=loadLogs();
    showToast('📱 オフライン：ローカルデータを使用');
  }
  renderCalendar();
}

function logout(){
  currentUser=null;
  cachedLogs=[];
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-shell').style.display='none';
  renderAccountList();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Storage（ユーザーごと）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function userKey(suffix){return `hlog_${currentUser}_${suffix}`;}
function loadLogs(){
  // キャッシュがあればキャッシュを使う
  if(cachedLogs&&cachedLogs.length>0)return cachedLogs;
  try{return JSON.parse(localStorage.getItem(userKey('logs'))||'[]');}catch{return[];}
}
function saveLogs(l){
  cachedLogs=l;
  localStorage.setItem(userKey('logs'),JSON.stringify(l));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Season
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SEASONS={
  1:{badge:'🎍',bg:['#0a0e1a','#1a1040','#0d1525'],overlay:'linear-gradient(160deg,rgba(255,220,80,.07) 0%,rgba(180,120,20,.04) 100%)',particles:()=>initSnow({color:'#fffde7',count:40,size:[2,5],speed:[0.3,0.8],sway:0.5}),extra:drawNewYear},
  2:{badge:'🍫',bg:['#1a0a14','#2d0f22','#120810'],overlay:'linear-gradient(160deg,rgba(220,80,120,.08) 0%,rgba(255,255,255,.03) 100%)',particles:()=>initMixed([{color:'#fff',count:25,size:[1,3],speed:[0.3,0.7],sway:0.4,shape:'snow'},{color:'#ff6b9d',count:15,size:[8,14],speed:[0.4,0.9],sway:1.2,shape:'heart'}])},
  3:{badge:'🌸',bg:['#1a0f14','#2a1020','#0f0a10'],overlay:'linear-gradient(160deg,rgba(255,182,193,.08) 0%,rgba(180,100,140,.04) 100%)',particles:()=>initPetals({color:'#ffb6c1',color2:'#ff8fab',count:35})},
  4:{badge:'🌱',bg:['#0a140a','#0d200d','#081008'],overlay:'linear-gradient(160deg,rgba(100,200,80,.09) 0%,rgba(180,240,100,.04) 100%)',particles:()=>initSparkles({color:'#a8e063',count:30,size:[2,6]})},
  5:{badge:'☁️',bg:['#0a1220','#0e1a2e','#080f1a'],overlay:'linear-gradient(180deg,rgba(100,160,255,.08) 0%,rgba(200,230,255,.05) 100%)',particles:()=>initClouds()},
  6:{badge:'🌧️',bg:['#080e18','#0a1520','#060c14'],overlay:'linear-gradient(180deg,rgba(80,120,200,.08) 0%,rgba(60,100,180,.04) 100%)',particles:()=>initRain()},
  7:{badge:'🎋',bg:['#020410','#050818','#010310'],overlay:'linear-gradient(160deg,rgba(100,80,200,.06) 0%,rgba(80,120,255,.04) 100%)',particles:()=>initStars()},
  8:{badge:'🌻',bg:['#100a00','#1e1200','#0c0800'],overlay:'linear-gradient(160deg,rgba(255,200,0,.08) 0%,rgba(255,140,0,.05) 100%)',particles:()=>initSunRays()},
  9:{badge:'🌅',bg:['#140808','#201010','#0e0606'],overlay:'linear-gradient(180deg,rgba(255,120,60,.09) 0%,rgba(180,60,120,.06) 50%,rgba(60,60,140,.06) 100%)',particles:()=>initDragonflies()},
  10:{badge:'🎃',bg:['#0a0500','#150a00','#060400'],overlay:'linear-gradient(160deg,rgba(255,100,0,.08) 0%,rgba(120,0,180,.06) 100%)',particles:()=>initBats()},
  11:{badge:'🍂',bg:['#120a04','#1e1008','#0c0804'],overlay:'linear-gradient(160deg,rgba(200,120,60,.08) 0%,rgba(160,80,30,.04) 100%)',particles:()=>initLeaves()},
  12:{badge:'🎄',bg:['#040a10','#060e18','#020810'],overlay:'linear-gradient(160deg,rgba(0,180,80,.06) 0%,rgba(200,0,0,.05) 50%,rgba(255,200,0,.04) 100%)',particles:()=>initChristmas()},
};
const canvas=document.getElementById('season-canvas');
const ctx=canvas.getContext('2d');
let W,H,particles=[],animId,drawExtra=null;
function resizeCanvas(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
class Particle{constructor(cfg){Object.assign(this,cfg);this.reset(true);}
reset(init){this.x=rand(0,W);this.y=init?rand(-H,H):-20;this.vx=rand(-0.3,0.3)*(this.sway||1);this.vy=rand(this.speed[0],this.speed[1]);this.r=rand(this.size[0],this.size[1]);this.alpha=rand(0.4,1);this.angle=rand(0,Math.PI*2);this.spin=rand(-0.03,0.03);}
step(){this.x+=this.vx+Math.sin(Date.now()*0.001+this.x)*0.2;this.y+=this.vy;this.angle+=this.spin;if(this.y>H+30)this.reset(false);}}
function initSnow(cfg){particles=Array.from({length:cfg.count},()=>new Particle({...cfg,shape:'snow'}));}
function initMixed(cfgs){particles=[];cfgs.forEach(cfg=>{for(let i=0;i<cfg.count;i++)particles.push(new Particle(cfg));});}
function initPetals(cfg){particles=Array.from({length:cfg.count},()=>({x:rand(0,W),y:rand(-H,H),vx:rand(-0.5,0.5),vy:rand(0.5,1.5),r:rand(5,10),angle:rand(0,Math.PI*2),spin:rand(-0.04,0.04),alpha:rand(0.5,0.9),color:Math.random()>0.5?cfg.color:cfg.color2,sway:rand(0.5,1.5),phase:rand(0,Math.PI*2),step(){this.phase+=0.03;this.x+=this.vx+Math.sin(this.phase)*this.sway*0.5;this.y+=this.vy;this.angle+=this.spin;if(this.y>H+20){this.y=-20;this.x=rand(0,W);}}}));}
function initSparkles(cfg){particles=Array.from({length:cfg.count},()=>({x:rand(0,W),y:rand(-H,H),vy:rand(0.3,0.8),vx:rand(-0.3,0.3),r:rand(cfg.size[0],cfg.size[1]),alpha:rand(0.3,0.8),color:cfg.color,pulse:rand(0,Math.PI*2),step(){this.pulse+=0.05;this.alpha=0.4+Math.sin(this.pulse)*0.3;this.y+=this.vy;this.x+=this.vx;if(this.y>H+10){this.y=-10;this.x=rand(0,W);}}}));}
function initClouds(){particles=Array.from({length:6},()=>({x:rand(0,W),y:rand(30,H*0.5),vx:rand(0.2,0.6),vy:0,r:rand(40,90),alpha:rand(0.04,0.1),step(){this.x+=this.vx;if(this.x-this.r>W+100)this.x=-this.r-50;}}));}
function initRain(){particles=Array.from({length:80},()=>({x:rand(0,W),y:rand(-H,H),vx:rand(0.5,1.5),vy:rand(8,18),len:rand(8,20),alpha:rand(0.2,0.5),step(){this.x+=this.vx;this.y+=this.vy;if(this.y>H+10){this.y=-10;this.x=rand(0,W);}}}));}
function initStars(){particles=Array.from({length:120},()=>({x:rand(0,W),y:rand(0,H),r:rand(0.5,2.5),alpha:rand(0.3,1),twinkle:rand(0,Math.PI*2),speed:rand(0.02,0.06),step(){this.twinkle+=this.speed;this.alpha=0.3+Math.abs(Math.sin(this.twinkle))*0.7;}}));}
function initSunRays(){particles=Array.from({length:12},(_,i)=>({angle:(i/12)*Math.PI*2,len:rand(80,160),alpha:rand(0.03,0.08),spin:0.003,step(){this.angle+=this.spin;}}));}
function initDragonflies(){particles=[...Array.from({length:30},()=>({x:rand(0,W),y:rand(0,H),r:rand(1,2.5),alpha:rand(0.3,0.8),color:Math.random()>0.3?'#ff7043':'#ab47bc',twinkle:rand(0,Math.PI*2),speed:rand(0.02,0.05),step(){this.twinkle+=this.speed;this.alpha=0.2+Math.abs(Math.sin(this.twinkle))*0.6;}})),...Array.from({length:5},()=>({x:rand(0,W),y:rand(H*0.3,H*0.8),vx:rand(-1.5,1.5),vy:rand(-0.5,0.5),phase:rand(0,Math.PI*2),wing:0,wingDir:1,isDragonfly:true,step(){this.phase+=0.02;this.x+=this.vx+Math.sin(this.phase)*0.5;this.y+=this.vy+Math.cos(this.phase*0.7)*0.3;this.wing+=0.15*this.wingDir;if(Math.abs(this.wing)>0.4)this.wingDir*=-1;if(this.x<-20)this.x=W+20;if(this.x>W+20)this.x=-20;if(this.y<20)this.vy=Math.abs(this.vy);if(this.y>H-20)this.vy=-Math.abs(this.vy);}}))]}
function initBats(){particles=Array.from({length:12},()=>({x:rand(0,W),y:rand(H*0.1,H*0.7),vx:rand(-2,2)||1,vy:rand(-0.5,0.5),phase:rand(0,Math.PI*2),wing:0,wingDir:1,step(){this.phase+=0.015;this.x+=this.vx;this.y+=this.vy+Math.sin(this.phase)*0.5;this.wing+=0.12*this.wingDir;if(Math.abs(this.wing)>0.5)this.wingDir*=-1;if(this.x<-40)this.x=W+40;if(this.x>W+40)this.x=-40;if(this.y<10)this.vy=Math.abs(this.vy);if(this.y>H-10)this.vy=-Math.abs(this.vy);}}));}
function initLeaves(){const colors=['#e65100','#bf360c','#f9a825','#6d4c41','#d84315'];particles=Array.from({length:30},()=>({x:rand(0,W),y:rand(-H,H),vx:rand(-0.8,0.8),vy:rand(0.8,2.5),r:rand(6,14),angle:rand(0,Math.PI*2),spin:rand(-0.05,0.05),alpha:rand(0.5,0.9),color:colors[randInt(0,colors.length-1)],phase:rand(0,Math.PI*2),step(){this.phase+=0.04;this.x+=this.vx+Math.sin(this.phase)*0.8;this.y+=this.vy;this.angle+=this.spin;if(this.y>H+20){this.y=-20;this.x=rand(0,W);}}}));}
function initChristmas(){particles=[...Array.from({length:40},()=>new Particle({color:'#fff',count:40,size:[1,4],speed:[0.4,1.2],sway:0.8,shape:'snow'})),...Array.from({length:20},()=>({x:rand(0,W),y:rand(0,H),r:rand(2,5),alpha:rand(0.4,1),color:['#ff0000','#ffd700','#00c853','#ffffff'][randInt(0,3)],twinkle:rand(0,Math.PI*2),speed:rand(0.03,0.08),step(){this.twinkle+=this.speed;this.alpha=0.3+Math.abs(Math.sin(this.twinkle))*0.7;}}))];}
function drawNewYear(){const cx=W*0.82,cy=H*0.22,rays=12,t=Date.now()*0.0005;for(let i=0;i<rays;i++){const a=(i/rays)*Math.PI*2+t,len=60+Math.sin(t*2+i)*15;const g=ctx.createLinearGradient(cx,cy,cx+Math.cos(a)*len,cy+Math.sin(a)*len);g.addColorStop(0,'rgba(255,220,80,0.18)');g.addColorStop(1,'rgba(255,180,0,0)');ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.strokeStyle=g;ctx.lineWidth=3;ctx.stroke();}ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,18);rg.addColorStop(0,'rgba(255,240,120,0.6)');rg.addColorStop(1,'rgba(255,180,0,0)');ctx.fillStyle=rg;ctx.fill();}
function drawParticle(p){ctx.save();ctx.globalAlpha=p.alpha||0.7;
if(p.shape==='snow'){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
else if(p.shape==='heart'){ctx.fillStyle=p.color;ctx.translate(p.x,p.y);ctx.rotate(p.angle);const s=p.r*0.12;ctx.beginPath();ctx.moveTo(0,-s*2);ctx.bezierCurveTo(s*3,-s*5,s*7,-s,0,s*4);ctx.bezierCurveTo(-s*7,-s,-s*3,-s*5,0,-s*2);ctx.fill();}
else if(p.isDragonfly){ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));ctx.strokeStyle='rgba(255,120,50,0.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.stroke();ctx.fillStyle='rgba(255,120,50,0.8)';ctx.beginPath();ctx.arc(7,0,2,0,Math.PI*2);ctx.fill();const wa=p.wing;[[1,-1],[1,1],[-1,-1],[-1,1]].forEach(([sx,sy])=>{ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(sx*8,sy*6+wa*10,sx*15,sy*4+wa*8,sx*12,sy*2);ctx.fillStyle=`rgba(200,220,255,${0.15+Math.abs(wa)*0.3})`;ctx.fill();});}
else if(p.wing!==undefined&&!p.isDragonfly){ctx.translate(p.x,p.y);ctx.fillStyle='rgba(80,0,100,0.7)';const wa=p.wing;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(8,wa*20,20,wa*15,22,2);ctx.bezierCurveTo(22,-4,10,-4,0,0);ctx.bezierCurveTo(-10,-4,-22,-4,-22,2);ctx.bezierCurveTo(-20,wa*15,-8,wa*20,0,0);ctx.fill();ctx.beginPath();ctx.arc(0,-3,3,0,Math.PI*2);ctx.fillStyle='rgba(60,0,80,0.9)';ctx.fill();}
else if(p.len){ctx.strokeStyle=`rgba(140,180,255,${p.alpha})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*p.len*0.1,p.y-p.len);ctx.stroke();}
else if(p.vx!==undefined&&p.vy===0){ctx.fillStyle=`rgba(200,220,255,${p.alpha})`;for(let ci=0;ci<4;ci++){ctx.beginPath();ctx.arc(p.x+ci*p.r*0.5-p.r*0.75,p.y+Math.sin(ci)*p.r*0.2,p.r*(0.5+ci*0.08),0,Math.PI*2);ctx.fill();}}
else if(p.angle!==undefined&&p.vy===undefined){ctx.save();ctx.translate(W*0.5,H*0.15);const g2=ctx.createLinearGradient(0,0,Math.cos(p.angle)*p.len,Math.sin(p.angle)*p.len);g2.addColorStop(0,'rgba(255,200,0,0.2)');g2.addColorStop(1,'rgba(255,160,0,0)');ctx.strokeStyle=g2;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(p.angle)*p.len,Math.sin(p.angle)*p.len);ctx.stroke();ctx.restore();}
else{if(p.color)ctx.fillStyle=p.color;if(p.r<=3){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}else{ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color||'#e65100';ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*0.55,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.stroke();}}
ctx.restore();}
function loop(){ctx.clearRect(0,0,W,H);if(new Date().getMonth()+1===7){const g=ctx.createLinearGradient(W*0.1,H*0.1,W*0.9,H*0.7);g.addColorStop(0,'rgba(120,100,200,0.06)');g.addColorStop(0.5,'rgba(180,160,255,0.12)');g.addColorStop(1,'rgba(100,80,180,0.06)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(W*0.5,H*0.4,W*0.4,H*0.15,-0.4,0,Math.PI*2);ctx.fill();}
particles.forEach(p=>{p.step();drawParticle(p);});if(drawExtra)drawExtra();animId=requestAnimationFrame(loop);}
function applySeason(){const m=new Date().getMonth()+1;const s=SEASONS[m];
document.getElementById('season-badge').textContent=s.badge;
document.getElementById('login-badge').textContent=s.badge;
const[c1,c2,c3]=s.bg;document.body.style.background=`radial-gradient(ellipse at 30% 20%,${c2} 0%,${c1} 50%,${c3} 100%)`;document.body.style.backgroundAttachment='fixed';
document.documentElement.style.setProperty('--season-overlay',s.overlay||'transparent');

// Weather
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const WMO={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WMO_T={0:'快晴',1:'晴れ',2:'一部曇り',3:'曇り',45:'霧',48:'着氷霧',51:'霧雨（弱）',53:'霧雨',55:'霧雨（強）',61:'小雨',63:'雨',65:'大雨',71:'小雪',73:'雪',75:'大雪',80:'にわか雨（弱）',81:'にわか雨',82:'にわか雨（強）',95:'雷雨',96:'雷雨＋ひょう',99:'激しい雷雨'};
let weatherData=null;
let userLat=null,userLon=null;

// 位置情報を取得してキャッシュ
async function getPosition(){
  if(userLat&&userLon)return{lat:userLat,lon:userLon};
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000}));
  userLat=pos.coords.latitude;userLon=pos.coords.longitude;
  return{lat:userLat,lon:userLon};
}

// 現在の天気を取得（頭痛発症時・現在モード）
async function fetchCurrentWeather(){
  try{
    const{lat,lon}=await getPosition();
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&timezone=Asia%2FTokyo`);
    const j=await r.json();const c=j.current;
    weatherData={temp:c.temperature_2m,humidity:c.relative_humidity_2m,pressure:Math.round(c.surface_pressure),code:c.weather_code,lat,lon,fetched_at:new Date().toISOString(),mode:'current'};
    renderWeather(weatherData,'w-icon','weather-grid','w-status');
  }catch(e){const el=document.getElementById('w-status');if(el)el.textContent='天気の取得に失敗しました';}
}

// 指定日時の天気を取得（頭痛発症時・後入力モード）
async function fetchPastWeather(dateStr,timeStr){
  try{
    const{lat,lon}=await getPosition();
    const dt=new Date(`${dateStr}T${timeStr||'12:00'}:00`);
    const dateISO=dateStr;
    const hour=dt.getHours();
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&start_date=${dateISO}&end_date=${dateISO}&timezone=Asia%2FTokyo`);
    const j=await r.json();
    const h=j.hourly;
    const idx=Math.min(hour,h.time.length-1);
    weatherData={temp:h.temperature_2m[idx],humidity:h.relative_humidity_2m[idx],pressure:Math.round(h.surface_pressure[idx]),code:h.weather_code[idx],lat,lon,fetched_at:new Date().toISOString(),mode:'past',target_datetime:`${dateStr}T${String(hour).padStart(2,'0')}:00`};
    renderWeather(weatherData,'w-icon','weather-grid','w-status');
  }catch(e){const el=document.getElementById('w-status');if(el)el.textContent='過去の天気取得に失敗しました';}
}

// 一日分の天気を3時間おきで取得（夜の記録用）
async function fetchDayWeather(dateStr){
  try{
    const{lat,lon}=await getPosition();
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&start_date=${dateStr}&end_date=${dateStr}&timezone=Asia%2FTokyo`);
    const j=await r.json();const h=j.hourly;

    // 3時間おき（0,3,6,9,12,15,18,21時）のデータを抽出
    const hours=[0,3,6,9,12,15,18,21];
    const hourly=hours.map(hr=>({
      time:`${String(hr).padStart(2,'0')}:00`,
      temp:h.temperature_2m[hr],
      humidity:h.relative_humidity_2m[hr],
      pressure:Math.round(h.surface_pressure[hr]),
      code:h.weather_code[hr],
      weather:WMO_T[h.weather_code[hr]]??'不明'
    }));

    // 表示用サマリー
    const temps=hourly.map(x=>x.temp);
    const pressures=hourly.map(x=>x.pressure);
    const summary={
      temp_max:Math.max(...temps),
      temp_min:Math.min(...temps),
      pressure_max:Math.max(...pressures),
      pressure_min:Math.min(...pressures),
      code:h.weather_code[12]??h.weather_code[0], // 昼12時の天気を代表値に
    };

    return{
      mode:'hourly3h',
      date:dateStr,
      lat,lon,
      fetched_at:new Date().toISOString(),
      hourly, // 3時間おきの配列
      summary  // サマリー（表示用・分析用）
    };
  }catch(e){console.warn('天気取得失敗',e);return null;}
}

function renderWeather(d,iconId,gridId,statusId){
  const iEl=document.getElementById(iconId),gEl=document.getElementById(gridId),sEl=document.getElementById(statusId);
  if(!iEl||!gEl||!sEl)return;
  iEl.textContent=WMO[d.code]??'🌡️';
  if(d.mode==='hourly3h'&&d.summary){
    const s=d.summary;
    gEl.innerHTML=`<div class="weather-item">天気</div><div class="weather-val">${WMO_T[s.code]??'不明'}</div><div class="weather-item">最高気温</div><div class="weather-val">${s.temp_max}℃</div><div class="weather-item">最低気温</div><div class="weather-val">${s.temp_min}℃</div><div class="weather-item">気圧変動</div><div class="weather-val">${s.pressure_min}→${s.pressure_max}hPa</div>`;
  }else{
    gEl.innerHTML=`<div class="weather-item">天気</div><div class="weather-val">${WMO_T[d.code]??'不明'}</div><div class="weather-item">気温</div><div class="weather-val">${d.temp}℃</div><div class="weather-item">気圧</div><div class="weather-val">${d.pressure}hPa</div><div class="weather-item">湿度</div><div class="weather-val">${d.humidity??'-'}%</div>`;
  }
  const modeStr=d.mode==='past'?`過去データ(${d.target_datetime?.slice(11,16)}時点)`:d.mode==='daily'?'一日分データ':'リアルタイム';
  sEl.textContent=`自動取得(${modeStr}) · `+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}

// 端末のローカル日付 yyyy-MM-dd（toISOStringはUTCなので朝9時前に前日になってしまう）
function localDateStr(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
// 記録の「対象日付」（GASが返すdate優先。なければtimestampからローカル日付）
function logDate(log){return log.date||(log.timestamp?localDateStr(new Date(log.timestamp)):'');}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Calendar
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();
function calMove(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}

function renderCalendar(){
  const logs=loadLogs();
  // 日付ごとのデータをマップ
  const dataMap={};
  logs.forEach(log=>{
    const[ly,lm,ld]=logDate(log).split('-').map(Number);
    if(ly!==calYear||lm-1!==calMonth)return;
    const key=ld;
    if(!dataMap[key])dataMap[key]={headache:false,night:false,entries:[]};
    if(log.type==='headache')dataMap[key].headache=true;
    if(log.type==='night')dataMap[key].night=true;
    dataMap[key].entries.push(log);
  });

  document.getElementById('cal-title').textContent=`${calYear}年${calMonth+1}月`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';

  // 曜日ヘッダー
  ['日','月','火','水','木','金','土'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);
  });

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const today=new Date();

  // 前月の空白
  for(let i=0;i<firstDay;i++){
    const el=document.createElement('div');el.className='cal-day other-month';
    const num=document.createElement('div');num.className='cal-day-num';num.textContent=daysInPrev-firstDay+1+i;
    el.appendChild(num);grid.appendChild(el);
  }

  // 当月
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');el.className='cal-day';
    const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    if(isToday)el.classList.add('today');
    const data=dataMap[d];
    if(data)el.classList.add('has-data');

    const num=document.createElement('div');num.className='cal-day-num';num.textContent=d;el.appendChild(num);

    if(data){
      const dots=document.createElement('div');dots.className='cal-dots';
      if(data.headache){const dot=document.createElement('div');dot.className='cal-dot headache';dots.appendChild(dot);}
      if(data.night){const dot=document.createElement('div');dot.className='cal-dot night';dots.appendChild(dot);}
      el.appendChild(dots);
    }

    el.onclick=()=>openDayModal(d,data);
    grid.appendChild(el);
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Day modal
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let editingEntry=null;

function openDayModal(day,data){
  const dateStr=`${calYear}年${calMonth+1}月${day}日`;
  document.getElementById('modal-day-title').textContent=dateStr;
  const btns=document.getElementById('day-select-btns');
  btns.innerHTML='';

  const headacheEntries=data?data.entries.filter(e=>e.type==='headache'):[];
  const nightEntries=data?data.entries.filter(e=>e.type==='night'):[];

  // 頭痛発症ボタン
  if(headacheEntries.length>0){
    headacheEntries.forEach((entry,i)=>{
      const btn=document.createElement('button');btn.className='day-select-btn';
      btn.innerHTML=`<span class="icon">🤕</span><span>頭痛発症時の記録${headacheEntries.length>1?` (${i+1})`:''}　痛み ${entry.pain_scale}/10</span>`;
      btn.onclick=()=>{closeModal('modal-day-select');openEditModal(entry);};
      btns.appendChild(btn);
    });
  }
  // 夜の記録ボタン
  if(nightEntries.length>0){
    nightEntries.forEach((entry,i)=>{
      const btn=document.createElement('button');btn.className='day-select-btn';
      btn.innerHTML=`<span class="icon">🌙</span><span>夜の記録${nightEntries.length>1?` (${i+1})`:''}</span>`;
      btn.onclick=()=>{closeModal('modal-day-select');openEditModal(entry);};
      btns.appendChild(btn);
    });
  }

  // 新規作成ボタン
  const addH=document.createElement('button');addH.className='day-select-btn';
  addH.innerHTML=`<span class="icon">➕</span><span>頭痛発症時を新規追加</span>`;
  addH.onclick=()=>{closeModal('modal-day-select');openNewEntry('headache',day);};
  btns.appendChild(addH);

  const addN=document.createElement('button');addN.className='day-select-btn';
  addN.innerHTML=`<span class="icon">➕</span><span>夜の記録を新規追加</span>`;
  addN.onclick=()=>{closeModal('modal-day-select');openNewEntry('night',day);};
  btns.appendChild(addN);

  openModal('modal-day-select');
}

function openNewEntry(type,day){
  const ts=new Date(calYear,calMonth,day,type==='night'?22:12,0,0).toISOString();
  const entry={id:Date.now(),type,user:currentUser,date:localDateStr(new Date(calYear,calMonth,day)),timestamp:ts,
    ...(type==='headache'?{onset_time:'',pain_scale:0,areas:[],pain_types:[],aura:null,symptoms:[],drugs:['none'],drug_time:null}:
    {wake_time:'',sleep_hours:0,caffeine:0,had_headache:null,memo:''}),weather:null};
  openEditModal(entry,true);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Edit modal
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openEditModal(entry,isNew=false){
  editingEntry=entry;
  const[,em,ed]=logDate(entry).split('-').map(Number);
  const dateStr=`${em}月${ed}日`;
  document.getElementById('modal-edit-title').textContent=
    (isNew?'新規 · ':'')+dateStr+' '+(entry.type==='headache'?'🤕 頭痛発症時':'🌙 夜の記録');

  const body=document.getElementById('modal-edit-body');

  if(entry.type==='headache'){
    const entryDateH=logDate(entry);
    body.innerHTML=`
      <div class="field"><label class="field-label">対象日付</label><input type="date" id="e-date"></div>
      <div class="field"><label class="field-label">発症時刻</label><input type="time" id="e-onset-time"></div>
      <div class="field"><label class="field-label">痛みの強さ</label>
        <div class="scale-wrap" id="e-scale-pain"></div><input type="hidden" id="e-pain-val">
        <div class="scale-hint"><span>気にならない</span><span>救急レベル</span></div>
      </div>
      <div class="field"><label class="field-label">部位</label><div class="chip-group" id="e-chips-area"></div></div>
      <div class="field"><label class="field-label">性質</label><div class="chip-group" id="e-chips-type"></div></div>
      <div class="field"><label class="field-label">前兆</label>
        <div class="toggle-group" id="e-aura-group">
          <button class="toggle-btn" onclick="toggleYN(this,'e-aura','yes')">あった</button>
          <button class="toggle-btn" onclick="toggleYN(this,'e-aura','no')">なかった</button>
        </div><input type="hidden" id="e-aura">
      </div>
      <div class="field"><label class="field-label">随伴症状</label><div class="chip-group" id="e-chips-assoc"></div></div>
      <div class="field"><label class="field-label">薬の服用</label><div class="chip-group" id="e-chips-drug"></div></div>
      <div class="field"><label class="field-label">服用時刻</label><input type="time" id="e-drug-time"></div>
    `;
    // 全時刻・日付フィールドをJSで設定（Safari対応）
    setTimeout(()=>{
      document.getElementById('e-date').value=entryDateH;
      const ot=formatTime(entry.onset_time);
      if(ot)document.getElementById('e-onset-time').value=ot;
      const dt=formatTime(entry.drug_time);
      if(dt)document.getElementById('e-drug-time').value=dt;
      document.getElementById('e-pain-val').value=entry.pain_scale||'';
    },200);
    // スケール
    const sw=document.getElementById('e-scale-pain');
    for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='scale-btn'+(Number(entry.pain_scale)===i?' selected':'');b.textContent=i;b.onclick=()=>{sw.querySelectorAll('.scale-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('e-pain-val').value=i;};sw.appendChild(b);}
    // チップス
    buildEditChips('e-chips-area',['前頭部','左側頭部','右側頭部','後頭部','頭全体','目の奥'],entry.areas||[]);
    buildEditChips('e-chips-type',['ズキズキ（拍動性）','締め付け','鈍い痛み','刺すような痛み'],entry.pain_types||[]);
    buildEditChips('e-chips-assoc',['吐き気','光過敏','音過敏','匂い過敏','めまい'],entry.symptoms||[]);
    buildEditChips('e-chips-drug',['triptan:トリプタン','calonapl:カロナール'],entry.drugs||[]);
    // 前兆
    if(entry.aura){const grp=document.getElementById('e-aura-group');grp.querySelectorAll('.toggle-btn').forEach(b=>{const v=b.onclick.toString().includes("'yes'")?'yes':'no';if(v===entry.aura)b.classList.add(v==='yes'?'selected-yes':'selected-no');});document.getElementById('e-aura').value=entry.aura;}
  } else {
    const entryDate=logDate(entry);
    body.innerHTML=`
      <div class="field"><label class="field-label">対象日付</label><input type="date" id="e-date"></div>
      <div class="input-row">
        <div class="field"><label class="field-label">起床時刻</label><input type="time" id="e-wake"></div>
        <div class="field"><label class="field-label">睡眠時間(h)</label><input type="number" id="e-sleep" min="0" max="24" step="0.5"></div>
      </div>
      <div class="field"><label class="field-label">カフェイン(杯)</label><input type="number" id="e-caffeine" min="0" max="20"></div>
      <div class="field"><label class="field-label">今日の頭痛</label>
        <div class="toggle-group" id="e-headache-group">
          <button class="toggle-btn" onclick="toggleYN(this,'e-had-headache','yes')">あった</button>
          <button class="toggle-btn" onclick="toggleYN(this,'e-had-headache','no')">なかった</button>
        </div><input type="hidden" id="e-had-headache">
      </div>
      <div class="field"><label class="field-label">メモ</label><textarea id="e-memo"></textarea></div>
    `;
    // 全フィールドをJSで設定（Safari対応）
    setTimeout(()=>{
      document.getElementById('e-date').value=entryDate;
      const wt=formatTime(entry.wake_time);
      if(wt)document.getElementById('e-wake').value=wt;
      document.getElementById('e-sleep').value=entry.sleep_hours??'';
      document.getElementById('e-caffeine').value=entry.caffeine??0;
      document.getElementById('e-memo').value=entry.memo||'';
    },200);
    if(entry.had_headache){const grp=document.getElementById('e-headache-group');grp.querySelectorAll('.toggle-btn').forEach(b=>{const v=b.onclick.toString().includes("'yes'")?'yes':'no';if(v===entry.had_headache)b.classList.add(v==='yes'?'selected-yes':'selected-no');});document.getElementById('e-had-headache').value=entry.had_headache;}
  }
  openModal('modal-edit');
}

// 時刻文字列を HH:MM 形式に正規化
function formatTime(val){
  if(!val&&val!==0)return '';
  const s=String(val).trim();
  if(!s)return '';
  // "07:00" "7:00:00" → "07:00"（先頭がHH:MMの場合のみ。"1899-12-29T…"のような日付文字列は対象外）
  const hm=s.match(/^(\d{1,2}):(\d{2})/);
  if(hm)return `${hm[1].padStart(2,'0')}:${hm[2]}`;
  // 数値の場合（Sheetsが数値で返すことがある）
  // Sheetsの時刻数値は1日=1なので時間に変換
  const n=Number(s);
  if(!isNaN(n)&&n>0&&n<1){
    const totalMin=Math.round(n*24*60);
    const h=Math.floor(totalMin/60);
    const m=totalMin%60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  return s.length>=5?s.slice(0,5):s;
}

function buildEditChips(id,items,selected){
  const wrap=document.getElementById(id);
  items.forEach(item=>{
    const[val,label]=item.includes(':')?item.split(':'):[item,item];
    const c=document.createElement('span');c.className='chip'+(selected.includes(val)?' selected':'');
    c.textContent=label;c.dataset.val=val;c.onclick=()=>c.classList.toggle('selected');
    wrap.appendChild(c);
  });
}
function getEditChips(id){return[...document.querySelectorAll(`#${id} .chip.selected`)].map(c=>c.dataset.val);}

async function saveEdit(){
  const entry=editingEntry;
  const editDate=document.getElementById('e-date')?.value;
  if(entry.type==='headache'){
    const ot=document.getElementById('e-onset-time').value;
    if(editDate)entry.date=editDate;
    if(editDate&&ot)entry.timestamp=new Date(`${editDate}T${ot}:00`).toISOString();
    else if(editDate)entry.timestamp=new Date(`${editDate}T12:00:00`).toISOString();
    entry.onset_time=ot;
    entry.pain_scale=Number(document.getElementById('e-pain-val').value)||0;
    entry.areas=getEditChips('e-chips-area');
    entry.pain_types=getEditChips('e-chips-type');
    entry.aura=document.getElementById('e-aura').value||null;
    entry.symptoms=getEditChips('e-chips-assoc');
    entry.drugs=getEditChips('e-chips-drug');
    if(entry.drugs.length===0)entry.drugs=['none'];
    entry.drug_time=document.getElementById('e-drug-time').value||null;
  } else {
    if(editDate){entry.date=editDate;entry.timestamp=new Date(`${editDate}T22:00:00`).toISOString();}
    entry.wake_time=document.getElementById('e-wake').value;
    entry.sleep_hours=Number(document.getElementById('e-sleep').value)||0;
    entry.caffeine=Number(document.getElementById('e-caffeine').value)||0;
    entry.had_headache=document.getElementById('e-had-headache').value||null;
    entry.memo=document.getElementById('e-memo').value.trim();
  }
  entry.edited_at=new Date().toISOString();

  const logs=loadLogs();
  const idx=logs.findIndex(l=>l.id===entry.id);
  if(idx>=0)logs[idx]=entry;else logs.unshift(entry);
  saveLogs(logs);
  cachedLogs=logs;
  await sendToSheets({...entry,action:'edit'});
  closeModal('modal-edit');
  showToast('✅ 記録を更新しました');
  renderCalendar();
}

async function deleteEntry(){
  if(!confirm('この記録を削除しますか？'))return;
  const logs=loadLogs();
  const filtered=logs.filter(l=>l.id!==editingEntry.id);
  saveLogs(filtered);
  cachedLogs=filtered;
  await sendToSheets({id:editingEntry.id,user:currentUser,action:'delete'});
  closeModal('modal-edit');
  showToast('🗑️ 削除しました');
  renderCalendar();
}

// Modal helpers
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.getElementById('modal-day-select').onclick=function(e){if(e.target===this)closeModal('modal-day-select');};
document.getElementById('modal-edit').onclick=function(e){if(e.target===this)closeModal('modal-edit');};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Toast
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// Init
